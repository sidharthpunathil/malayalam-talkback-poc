[project]
name = "malayalam-talkback-rest"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.30.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
